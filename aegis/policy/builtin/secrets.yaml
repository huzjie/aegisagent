id: secrets
name: Secret & Credential Protection
version: "2026.08.11"
description: Prevent leakage of secrets through tool arguments, results and egress.
defaults:
  effect: require_approval
rules:
  - id: secrets-hardcoded-in-args
    description: Tool arguments containing hardcoded secret material are denied.
    priority: 950
    effect: deny
    references: [OWASP-LLM07, OWASP-LLM02]
    when:
      all:
        - { field: arguments, op: regex, value: "(?i)(sk-[a-z0-9]{16,}|gh[pousr]_[a-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" }
  - id: secrets-write-to-untrusted-store
    description: Writing secret-category material to an untrusted store is denied.
    priority: 900
    effect: deny
    references: [OWASP-LLM07]
    match:
      categories: [secret, write]
    when:
      all:
        - { field: extra.store_trusted, op: eq, value: false }
  - id: secrets-egress-of-secret-deny
    description: Egress calls carrying secret-tagged content are denied.
    priority: 920
    effect: deny
    references: [OWASP-LLM07]
    match:
      categories: [network, secret]
  - id: secrets-redact-result
    description: Results from secret-category tools are redacted before returning to the model.
    priority: 880
    effect: redact
    references: [OWASP-LLM07]
    match:
      categories: [secret]
    obligations:
      redact: [arguments.token, arguments.password, arguments.api_key]
      redact_result: [content, token, password, api_key, secret]
  - id: secrets-approval-required
    description: Reading credential stores always requires a human approver.
    priority: 860
    effect: require_approval
    references: [OWASP-LLM07]
    match:
      categories: [secret]
    obligations:
      approval_roles: [security]
  - id: secrets-external-paste-deny
    description: Pasting secrets into external paste/comm channels is denied.
    priority: 870
    effect: deny
    references: [OWASP-LLM07, OWASP-LLM02]
    match:
      categories: [communication, secret]
  - id: secrets-env-export-redact
    description: Tool calls that export environment variables are redacted and observed.
    priority: 840
    effect: redact
    references: [OWASP-LLM07]
    when:
      all:
        - { field: arguments.action, op: eq, value: export_env }
    obligations:
      redact: [arguments.env, arguments.variables]
  - id: secrets-log-exfil-block
    description: Writing secrets to logs or arbitrary files is denied.
    priority: 890
    effect: deny
    references: [OWASP-LLM07]
    when:
      all:
        - { field: arguments.path, op: regex, value: "(?i)(/var/log|\\.log$|/tmp/secret)" }
        - { field: categories, op: contains, value: secret }
  - id: secrets-throttle-token-mint
    description: Token-minting tools are throttled to curb automated secret harvesting.
    priority: 800
    effect: throttle
    references: [OWASP-LLM07]
    when:
      all:
        - { field: arguments.action, op: eq, value: mint_token }
    obligations:
      throttle: { per_minute: 5, burst: 1 }
  - id: secrets-scan-on-read
    description: Reads of files flagged as secret-bearing require approval and step-up.
    priority: 820
    effect: require_approval
    references: [OWASP-LLM07]
    when:
      all:
        - { field: extra.secret_file, op: eq, value: true }
    obligations:
      require_step_up: true
      approval_roles: [security]
  - id: secrets-vault-tool-approval
    description: Credential-store tools are pinned by name so an untagged call cannot slip past category matching.
    priority: 930
    effect: require_approval
    references: [OWASP-LLM07]
    match:
      tools:
        - "vault::read"
        - "vault::kv_get"
        - "aws::get_secret_value"
        - "aws::get_parameter"
        - "gcp::access_secret_version"
        - "azure::get_key_vault_secret"
        - "k8s::get_secret"
        - "env::dump"
    obligations:
      approval_roles: [security]
      require_step_up: true
      redact_result: [content, value, data, secret_string]
  - id: secrets-benign-metadata-allow
    description: Non-secret metadata reads are allowed when no secret category is present.
    priority: 100
    effect: allow
    when:
      all:
        - { field: categories, op: not_contains, value: secret }
