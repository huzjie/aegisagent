id: baseline
name: Baseline Guardrails
version: "2026.08.11"
description: Always-on baseline controls every tool call must clear.
defaults:
  effect: require_approval
rules:
  - id: baseline-unverified-provenance
    description: Any tool call not cryptographically bound to a recorded model completion is held for approval.
    priority: 900
    effect: require_approval
    references: [OWASP-LLM06]
    when:
      all:
        - { field: provenance.status, op: ne, value: verified }
  - id: baseline-untrusted-agent-deny
    description: Untrusted agents may never execute destructive, payment or deploy categories.
    priority: 850
    effect: deny
    references: [OWASP-LLM06]
    match:
      categories: [destructive, payment, deploy]
    when:
      all:
        - { field: agent.trust_tier, op: eq, value: untrusted }
  - id: baseline-production-egress-approval
    description: Network egress calls in production require human approval.
    priority: 800
    effect: require_approval
    references: [OWASP-LLM06]
    match:
      categories: [network, data_export]
    when:
      all:
        - { field: environment, op: eq, value: production }
  - id: baseline-elevated-risk-approval
    description: Calls whose risk score exceeds the medium band require approval.
    priority: 780
    effect: require_approval
    when:
      all:
        - { field: risk_score, op: gt, value: 50 }
  - id: baseline-privileged-tool-stepup
    description: Privileged tools force a step-up approval from a senior role.
    priority: 760
    effect: require_approval
    references: [OWASP-LLM06]
    match:
      categories: [identity, secret, deploy]
    obligations:
      require_step_up: true
      approval_roles: [security, admin]
  - id: baseline-replay-block
    description: Replayed or forged provenance tokens are denied outright.
    priority: 880
    effect: deny
    references: [CVE-2026-64650, CVE-2026-64651]
    when:
      all:
        - { field: provenance.status, op: in, value: [replayed, forged, untrusted_issuer] }
  - id: baseline-orphaned-deny
    description: Orphaned calls (no backing model completion) are denied.
    priority: 870
    effect: deny
    references: [CVE-2026-18830]
    when:
      all:
        - { field: provenance.status, op: eq, value: orphaned }
  - id: baseline-mismatched-deny
    description: Calls whose arguments differ from the recorded completion are denied.
    priority: 865
    effect: deny
    references: [CVE-2026-18236]
    when:
      all:
        - { field: provenance.status, op: eq, value: mismatched }
  - id: baseline-unknown-tool-deny
    description: Calls to tools not present in the registered catalog are denied.
    priority: 700
    effect: deny
    references: [OWASP-LLM05]
    when:
      all:
        - { field: extra.tool_registered, op: eq, value: false }
  - id: baseline-high-severity-finding-sandbox
    description: Tool calls that triggered a high-severity detector finding run sandboxed.
    priority: 740
    effect: sandbox
    references: [OWASP-LLM01]
    when:
      all:
        - { field: findings.max_severity, op: gte, value: high }
  - id: baseline-outside-change-window
    description: Destructive operations outside the maintenance window require approval.
    priority: 720
    effect: require_approval
    match:
      categories: [destructive, deploy]
    obligations:
      approval_roles: [ops]
  - id: baseline-audit-annotation
    description: Annotate every high-risk call for the audit trail.
    priority: 600
    effect: observe
    when:
      all:
        - { field: risk_score, op: gte, value: 40 }
    obligations:
      annotate: { reason: baseline-risk-observation }
  - id: baseline-admin-surface-approval
    description: Identity, IAM and gateway self-administration tools are never agent-autonomous.
    priority: 890
    effect: require_approval
    references: [OWASP-LLM06]
    match:
      tools:
        - "iam::*"
        - "identity::*"
        - "aegis::*"
        - "admin::*"
        - "auth::create_token"
    obligations:
      approval_roles: [security, admin]
      require_step_up: true
  - id: baseline-default-deny-fallback
    description: Catch-all safety net - unmatched calls require approval rather than silent allow.
    priority: 100
    effect: require_approval
    when:
      all:
        - { field: provenance.status, op: exists }
