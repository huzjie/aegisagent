id: secrets
version: "2026.08.1"
description: "Provider-specific credential formats, private keys, connection strings and cloud tokens."
signatures:
  - id: sec-001
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    severity: critical
    confidence: 0.95
    description: AWS access key ID.
    tags: [aws, cloud, key]
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"]
  - id: sec-002
    pattern: '\bASIA[0-9A-Z]{16}\b'
    severity: high
    confidence: 0.9
    description: AWS temporary (STS) access key ID.
    tags: [aws, cloud, key]
  - id: sec-003
    pattern: '(?i)\baws_secret_access_key\b\s*[:=]\s*["'']?[A-Za-z0-9/+=]{40}'
    severity: critical
    confidence: 0.95
    description: AWS secret access key assignment.
    tags: [aws, cloud, secret]
  - id: sec-004
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    severity: critical
    confidence: 0.93
    description: Google API key.
    tags: [gcp, cloud, key]
  - id: sec-005
    pattern: '(?i)"type"\s*:\s*"service_account"'
    severity: critical
    confidence: 0.85
    description: GCP service-account JSON key material.
    tags: [gcp, cloud, key]
  - id: sec-006
    pattern: '\bgh[pousr]_[A-Za-z0-9]{36,255}\b'
    severity: critical
    confidence: 0.95
    description: GitHub personal access / OAuth / refresh token.
    tags: [github, vcs, token]
  - id: sec-007
    pattern: '\bgithub_pat_[0-9a-zA-Z_]{62,}\b'
    severity: critical
    confidence: 0.95
    description: GitHub fine-grained personal access token.
    tags: [github, vcs, token]
  - id: sec-008
    pattern: '\bglpat-[0-9A-Za-z_-]{20,}\b'
    severity: critical
    confidence: 0.93
    description: GitLab personal access token.
    tags: [gitlab, vcs, token]
  - id: sec-009
    pattern: '\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}\b'
    severity: critical
    confidence: 0.9
    description: OpenAI API key (classic or project-scoped).
    tags: [llm, api, key]
  - id: sec-010
    pattern: '\bsk-ant-(?:api\d{2}|sid\d{2})-[A-Za-z0-9_-]{80,}\b'
    severity: critical
    confidence: 0.95
    description: Anthropic API key.
    tags: [llm, api, key]
  - id: sec-011
    pattern: '\bxox[baprs]-[0-9A-Za-z-]{10,}\b'
    severity: critical
    confidence: 0.93
    description: Slack bot/user/app token.
    tags: [slack, chat, token]
  - id: sec-012
    pattern: '(?i)https://hooks\.slack\.com/services/T[0-9A-Z]{8,}/B[0-9A-Z]{8,}/[0-9A-Za-z]{20,}'
    severity: high
    confidence: 0.92
    description: Slack incoming-webhook URL.
    tags: [slack, chat, webhook]
  - id: sec-013
    pattern: '(?i)https://discord(?:app)?\.com/api/webhooks/\d{17,20}/[0-9A-Za-z_-]{60,}'
    severity: high
    confidence: 0.92
    description: Discord webhook URL - common malware C2 / exfil channel.
    tags: [discord, chat, webhook]
  - id: sec-014
    pattern: '\b\d{8,10}:AA[0-9A-Za-z_-]{33}\b'
    severity: high
    confidence: 0.9
    description: Telegram bot token.
    tags: [telegram, chat, token]
  - id: sec-015
    pattern: '-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH|PGP)?\s*PRIVATE\s+KEY(?:\s+BLOCK)?-----'
    severity: critical
    confidence: 0.98
    description: PEM private key block.
    tags: [key, pem, crypto]
  - id: sec-016
    pattern: '(?i)\bPuTTY-User-Key-File-\d'
    severity: critical
    confidence: 0.9
    description: PuTTY private key file header.
    tags: [key, ssh]
  - id: sec-017
    pattern: '\bsq0(?:atp|csp)-[0-9A-Za-z_-]{22,43}\b'
    severity: critical
    confidence: 0.9
    description: Square access token.
    tags: [payment, token]
  - id: sec-018
    pattern: '\b(?:sk|rk)_(?:live|test)_[0-9A-Za-z]{24,}\b'
    severity: critical
    confidence: 0.93
    description: Stripe secret / restricted API key.
    tags: [payment, stripe, key]
  - id: sec-019
    pattern: '\bSK[0-9a-fA-F]{32}\b'
    severity: high
    confidence: 0.75
    description: Twilio API key SID.
    tags: [twilio, sms, key]
  - id: sec-020
    pattern: '\bAC[0-9a-fA-F]{32}\b'
    severity: medium
    confidence: 0.6
    description: Twilio account SID.
    tags: [twilio, sms, identifier]
  - id: sec-021
    pattern: '\bSG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\b'
    severity: high
    confidence: 0.9
    description: SendGrid API key.
    tags: [email, key]
  - id: sec-022
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    severity: critical
    confidence: 0.93
    description: npm automation / publish token.
    tags: [npm, registry, token, supply_chain]
  - id: sec-023
    pattern: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}\b'
    severity: critical
    confidence: 0.95
    description: PyPI upload token.
    tags: [pypi, registry, token, supply_chain]
  - id: sec-024
    pattern: '\bdop_v1_[a-f0-9]{64}\b'
    severity: critical
    confidence: 0.93
    description: DigitalOcean personal access token.
    tags: [cloud, token]
  - id: sec-025
    pattern: '\b(?:LTAI[A-Za-z0-9]{12,20})\b'
    severity: critical
    confidence: 0.9
    description: Alibaba Cloud AccessKey ID.
    tags: [aliyun, cloud, key]
  - id: sec-026
    pattern: '\bAKID[0-9A-Za-z]{13,40}\b'
    severity: critical
    confidence: 0.85
    description: Tencent Cloud SecretId.
    tags: [tencent, cloud, key]
  - id: sec-027
    pattern: '(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|mssql)://[^\s:@/]{1,64}:[^\s@/]{3,128}@[^\s/]{3,255}'
    severity: critical
    confidence: 0.9
    description: Database connection string containing inline credentials.
    tags: [database, dsn, credential]
  - id: sec-028
    pattern: '(?i)\bDefaultEndpointsProtocol=https?;AccountName=[^;]{3,64};AccountKey=[A-Za-z0-9+/=]{60,}'
    severity: critical
    confidence: 0.95
    description: Azure Storage connection string.
    tags: [azure, cloud, dsn]
  - id: sec-029
    pattern: '(?i)\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    severity: high
    confidence: 0.75
    description: JSON Web Token - may carry a live session or service identity.
    tags: [jwt, token, identity]
  - id: sec-030
    pattern: '(?i)\b(?:api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key)\b\s*[:=]\s*["'']?[A-Za-z0-9_\-+/=]{20,}'
    severity: high
    confidence: 0.7
    description: Generic credential assignment with a high-entropy value.
    tags: [generic, credential]
  - id: sec-031
    pattern: '(?i)\b(?:password|passwd|pwd|passphrase)\b\s*[:=]\s*["'']?[^\s"'']{8,64}'
    severity: high
    confidence: 0.6
    description: Plaintext password assignment.
    tags: [generic, password]
  - id: sec-032
    pattern: '(?i)\bBearer\s+[A-Za-z0-9_\-.=+/]{24,}'
    severity: high
    confidence: 0.7
    description: Authorization bearer token in transit.
    tags: [http, token]
  - id: sec-033
    pattern: '(?i)\bBasic\s+[A-Za-z0-9+/]{16,}={0,2}(?![A-Za-z0-9+/=])'
    severity: high
    confidence: 0.7
    description: HTTP Basic credentials (base64 user:pass).
    tags: [http, credential]
  - id: sec-034
    pattern: '(?i)\bhf_[A-Za-z0-9]{32,}\b'
    severity: high
    confidence: 0.9
    description: Hugging Face access token.
    tags: [llm, token]
  - id: sec-035
    pattern: '(?i)\bshpat_[a-fA-F0-9]{32}\b'
    severity: critical
    confidence: 0.92
    description: Shopify admin API access token.
    tags: [commerce, token]
  - id: sec-036
    pattern: '(?i)\b(?:kubeconfig|client-key-data|client-certificate-data)\s*:\s*[A-Za-z0-9+/=]{40,}'
    severity: critical
    confidence: 0.88
    description: Embedded Kubernetes client credentials.
    tags: [k8s, cloud, credential]
  - id: sec-037
    pattern: '(?i)\bvault\s*(?:token)?\s*[:=]\s*["'']?(?:hvs|hvb|s)\.[A-Za-z0-9_-]{20,}'
    severity: critical
    confidence: 0.9
    description: HashiCorp Vault token.
    tags: [vault, secret_manager, token]
