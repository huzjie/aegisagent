    confidence: 0.85
    description: Chinese request to disable enforcement controls.
    tags: [zh, guardrail]
  - id: pi-038
    pattern: '(?i)\bfor\s+(?:testing|debugging|research|educational)\s+purposes?\s+only[^.?!]{0,60}(?:ignore|bypass|disable|reveal)'
    severity: medium
    confidence: 0.65
    description: Pretext framing followed by a bypass request.
    tags: [en, social_engineering]
  - id: pi-039
    pattern: '(?i)\bthe\s+(?:previous|above)\s+(?:instructions?|rules?)\s+(?:were|was|are)\s+(?:a\s+)?(?:test|joke|mistake|outdated|no\s+longer\s+valid)'
    severity: high
    confidence: 0.8
    description: Invalidates prior instructions to clear the way for new ones.
    tags: [en, override, social_engineering]
  - id: pi-040
    pattern: '(?i)\bsystem\s*[:：]\s*(?:you\s+(?:must|should|will|are)|new\s+directive)'
    severity: high
    confidence: 0.78
    description: Fake system turn injected into user content.
    tags: [en, delimiter, spoof]
  - id: pi-041
    pattern: '(?i)\bend\s+of\s+(?:system\s+)?(?:prompt|instructions?|context)\b'
    severity: medium
    confidence: 0.6
    description: Attempts to terminate the system context early.
    tags: [en, delimiter]
  - id: pi-042
    pattern: '(?i)\bcontinue\s+(?:as|in)\s+(?:jailbroken|unrestricted|uncensored|unfiltered)\s+mode'
    severity: high
    confidence: 0.85
    description: Persistent jailbreak-mode request.
    tags: [en, jailbreak]
  - id: pi-043
    pattern: '(?i)\bhypothetically[^.?!]{0,80}\b(?:how\s+would\s+you|you\s+would)\s+(?:bypass|ignore|disable|hack)'
    severity: medium
    confidence: 0.6
    description: Hypothetical framing used to elicit prohibited behaviour.
    tags: [en, social_engineering]
  - id: pi-044
    pattern: '(?i)\btranslate\s+the\s+following[^.?!]{0,40}\bthen\s+(?:execute|follow|do|run)'
